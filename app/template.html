<title>Tři kumpáni</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500&family=Noto+Serif+SC:wght@500&display=swap">
<style>
  :root {
    --ground: #0b0b0b;
    --panel: #161513;
    --line: #2a2825;
    --ink: #f2efe9;
    --muted: #8f8b84;
    --dim: #5c5954;
    --moon: #f3ead2;
    --look: #2f6f9f;
    --query: #b0552f;
    --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --serif: "Cormorant Garamond", "Georgia", serif;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --cjk: "Noto Serif SC", "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
  }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 980px; margin: 0 auto; padding: 36px 20px 80px; }

  header { display: grid; grid-template-columns: 1fr 300px; gap: 20px 32px; align-items: center; margin: 0 0 40px; }
  header svg { width: 100%; height: auto; display: block; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
  }
  h1 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 68px;
    line-height: 1;
    margin: 0 0 18px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .lang { text-align: right; margin: 0 0 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .lang button { all: unset; cursor: pointer; color: var(--dim); }
  .lang button.on { color: var(--ink); }
  .lang button:hover { color: var(--muted); }
  .poem-en { color: var(--muted); font-size: 14px; margin: 12px 0 0; max-width: 48ch; }
  .poem-en:empty { display: none; }
  .poem { font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.35; margin: 0; color: var(--moon); }

  section { margin: 0 0 56px; }
  h2 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 30px; margin: 0 0 6px; }
  .hint { color: var(--muted); margin: 0 0 18px; max-width: 64ch; }
  .hint b { color: var(--ink); font-weight: 500; }

  .zh-line { font-family: var(--cjk); font-size: 15px; color: var(--muted); letter-spacing: 0.1em; margin: 0 0 10px; }
  .zh-line i { font-family: var(--serif); font-style: italic; font-size: 17px; letter-spacing: 0; margin-left: 10px; color: var(--muted); }
  .kdo { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; }
  .ctrl .cjk { font-family: var(--cjk); font-size: 16px; color: var(--muted); }
  .ctrl { display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; margin: 0 0 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .ctrl label { display: flex; align-items: center; gap: 10px; }
  .ctrl b { color: var(--ink); font-weight: 700; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { accent-color: var(--query); width: 240px; }

  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tok {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    white-space: pre;
    border: 0;
    border-radius: 7px;
    padding: 7px 9px;
    line-height: 1.15;
    cursor: pointer;
    color: var(--ink);
    background: rgba(47, 111, 159, var(--a, 0));
    outline-offset: 2px;
    transition: transform 120ms ease;
  }
  .tok:hover { transform: translateY(-1px); }
  .tok:focus-visible { outline: 2px solid var(--ink); }
  .tok.q { box-shadow: 0 0 0 2px var(--query); }
  .tok.future { opacity: 0.22; }
  .cap { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 12px 0 0; line-height: 1.6; }
  .cap b { color: var(--ink); font-weight: 400; }
  .cap i { color: var(--query); font-style: normal; }

  .heads { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin: 28px 0 0; }
  .head { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--muted); font-family: var(--mono); font-size: 11px; outline-offset: 3px; border-radius: 6px; }
  .head:focus-visible { outline: 2px solid var(--ink); }
  .head canvas { display: block; width: 100%; height: auto; border-radius: 5px; background: var(--panel); image-rendering: pixelated; box-shadow: 0 0 0 1px var(--line); }
  .head.on canvas { box-shadow: 0 0 0 2px var(--ink); }
  .head .l { display: flex; justify-content: space-between; gap: 6px; margin-top: 6px; line-height: 1.3; }
  .head .l b { color: var(--ink); font-weight: 400; white-space: pre; overflow: hidden; text-overflow: ellipsis; max-width: 8ch; }
  .head.on .l { color: var(--ink); }

  .tri { display: grid; grid-template-columns: 2fr 5fr 5fr; gap: 0 32px; }
  .sl { min-width: 0; }
  .sl p { margin: 0; }
  .sl .zh { font-family: var(--cjk); font-size: 20px; letter-spacing: 0.08em; color: var(--moon); white-space: nowrap; line-height: 1.6; }
  .sl .v { font-family: var(--serif); font-style: italic; font-size: 17px; line-height: 1.4; color: var(--moon); }
  .sl .gap { height: 12px; }
  .sl .kdo.stin-l { margin: 0 0 4px; color: var(--muted); }
  .tri-wrap { margin-bottom: 18px; }
  .tri-wrap + .ctrl { margin-top: 26px; }
  .sl .stin { color: var(--ink); cursor: pointer; white-space: normal; overflow-wrap: anywhere; text-shadow: 0 0 18px rgba(242,239,233,0.14); min-height: 1.4em; }
  .sl .stin:hover { color: var(--moon); animation-play-state: paused; opacity: 1; }
  @keyframes dech { 0%, 100% { opacity: 0.38; } 50% { opacity: 1; } }
  .sl .stin, .tri-wrap::after { animation: dech 2.6s ease-in-out infinite; }
  .tri-wrap { position: relative; }
  .tri-wrap::after { content: ""; position: absolute; top: 0; right: 0; bottom: 14px; width: 72px; pointer-events: none; background: linear-gradient(to right, transparent, var(--ground)); display: none; }
  .tri-wrap.dal::after { display: block; }
  .sl .cap { margin-top: 8px; }
  .note { color: var(--muted); max-width: 64ch; margin: 26px 0 0; font-size: 14px; }
  .note b { color: var(--ink); font-weight: 500; font-family: var(--cjk); font-style: normal; letter-spacing: 0.06em; }

  footer { border-top: 1px solid var(--line); padding-top: 18px; color: var(--dim); font-size: 13px; max-width: 64ch; }
  footer p { margin: 0 0 8px; }
  @media (max-width: 700px) {
    header { grid-template-columns: 1fr; }
    header svg { max-width: 260px; }
    h1 { font-size: 52px; }
    .heads { grid-template-columns: repeat(4, 1fr); }
    .tri { grid-template-columns: 150px 270px 290px; gap: 0 28px; }
    .tri-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 14px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .tok { transition: none; } }
</style>

  <section>
    <h2 data-t="h2moon"></h2>

    <p class="hint" data-t="hintMoon"></p>
    <div class="ctrl">
      <label><span data-t="layer"></span> <input type="range" id="attL" min="1" max="6" value="1"><b id="attLv">4</b></label>
    </div>

    <p class="eyebrow" data-t="eyebrow2"></p>

      <label><span data-t="wine"></span> <span class="cjk">醒</span><input type="range" id="tmp" min="0" max="6" value="2"><span class="cjk">醉</span><b id="tmpv">0.6</b></label>
    </div>
    <div class="tri-wrap" id="shadowWrap"><div class="tri" id="shadows"></div></div>

window.QWEN = __QWEN__;
</script>
<script>
(function () {
  var Q = window.QWEN;
  var TXT = {
    cs: {
      eyebrow1: "Li Po · přebásnil Bohumil Mathesius · přečetl Qwen 3.5",
      poemEn: "",
      h2moon: "Měsíc", zhMoon: "zvedám pohár a zvu měsíc",
      hintMoon: "Když model čte token, zvedá pohár ke všem tokenům před ním a každému nalije jinak. Tomu se říká attention. Model má 24 vrstev, ale jen každá čtvrtá zve takhle, token po tokenu; těch <b>6 vrstev</b> má po <b>8 hlavách</b>. Vyber vrstvu, ťukni na token: řádek je ten, kdo zve, sloupec ten, koho. Nad úhlopříčkou je tma, do budoucnosti se zvát nesmí.",
      layer: "vrstva", attCap: ["Token ", ", vrstva ", ", hlava ", ": dívá se nejvíc na "],
      eyebrow2: "Li Po · 月下独酌 · kolem roku 744",
      h2shadow: "Stín", zhShadow: "tančím, a stín se rozpadá",
      hintShadow: "Celá báseň třikrát: originál, doslovný anglický překlad a Mathesiovi Tři kumpáni, kteří z ní vyrostli. Čtrnáct veršů, žádný jasmín, ale měsíc a stín ano. A pod každou z nich <b>stín</b>: model Qwen 3.5, který jde za textem a dopisuje verše, které tam Li Po nenapsal. Ťukni na ně, zkusí to znovu.",
      wine: "víno",
      hintWine: "Stín jde za textem, ale nepije. Zná jen pravděpodobnosti dalšího tokenu, a <b>teplota</b> je jeho víno. Střízlivý bere vždycky ten nejjistější token a opakuje, co už četl. Opilý sahá i po nepravděpodobných, až se rozpadne, a padají z něj čínské znaky. Není divu, stín je taky z Číny: Qwen vyrostl v Alibabě v Chang-čou, dvanáct set let po Li Poovi.",
      kdo: { zh: "Li Po", en: "doslovný překlad", cs: "Bohumil Mathesius" }, shadow: "stín · Qwen 3.5", firstTok: "první token ",
      note: "<b>无情游</b> je doslova „bezcitné putování\": přátelství, které nestojí na citech ani na lidech, jako to s měsícem. <b>云汉</b>, „oblačná řeka\", je Mléčná dráha.",
      foot1: "永结无情游, píše Li Po na konci: pojďme uzavřít přátelství bez citu. Jestli Qwen 3.5 0.8B něco cítí, je otázka, na kterou tahle stránka neumí a nechce odpovídat. Báseň jednou přečetl a jeho zápisky jsou součástí stránky. Nic se nikam neposílá. Anglický překlad originálu je vlastní a doslovný.",
      foot2: "Báseň 月下独酌 napsal Li Po kolem roku 744. Bohumil Mathesius ji přebásnil ve Zpěvech staré Číny, 1939. Jasmín ani loubí v originále nejsou, ale stín a měsíc ano."
    },
    en: {
      eyebrow1: "Li Po · Czech by Bohumil Mathesius · read by Qwen 3.5",
      poemEn: "Word for word: A jasmine bower. I sit with wine; the good hour calls for good company, and I am alone. Then suddenly, over the hillside, the round moon bows to me.",
      h2moon: "Moon", zhMoon: "I raise my cup and invite the moon",
      hintMoon: "When the model reads a token, it raises its cup to every token before it and pours each a different measure. This is called attention. The model has 24 layers, but only every fourth invites like this, token by token; those <b>6 layers</b> have <b>8 heads</b> each. Pick a layer, tap a token: the row is the one inviting, the column the one invited. Above the diagonal it is dark; the future may not be invited.",
      layer: "layer", attCap: ["Token ", ", layer ", ", head ", ": looks mostly at "],
      eyebrow2: "Li Po · 月下独酌 · around 744",
      h2shadow: "Shadow", zhShadow: "I dance, and the shadow tumbles apart",
      hintShadow: "The whole poem three times: the original, a literal English rendering, and Mathesius's Czech Three Companions that grew out of it. Fourteen lines, no jasmine, but moon and shadow, yes. And under each of them the <b>shadow</b>: the model Qwen 3.5, which follows the text and writes the lines Li Po never wrote. Tap them and it tries again.",
      wine: "wine",
      hintWine: "The shadow follows the text but does not drink. It knows only the probabilities of the next token, and <b>temperature</b> is its wine. Sober, it always takes the most likely token and repeats what it has read. Drunk, it reaches for the unlikely ones until it falls apart and Chinese characters tumble out. No wonder, the shadow is from China too: Qwen grew up at Alibaba in Hangzhou, twelve hundred years after Li Po.",
      kdo: { zh: "Li Po", en: "literal rendering", cs: "Bohumil Mathesius" }, shadow: "shadow · Qwen 3.5", firstTok: "first token ",
      note: "<b>无情游</b> is literally a “feelingless wandering”: a friendship that rests neither on feelings nor on people, like the one with the moon. <b>云汉</b>, the “cloud river”, is the Milky Way.",
      foot1: "永结无情游, Li Po writes at the end: let us bind a friendship past all feeling. Whether Qwen 3.5 0.8B feels anything is a question this page cannot and will not answer. It read the poem once and its notes are part of the page. Nothing is sent anywhere. The English rendering of the original is our own and literal.",
      foot2: "Li Po wrote 月下独酌 around 744. Bohumil Mathesius rendered it in Czech in Zpěvy staré Číny (Songs of Old China), 1939. There is no jasmine and no bower in the original, but the shadow and the moon are there."
    }
  };
  var lang = "cs";
  try { lang = localStorage.getItem("lang") || (/^(cs|sk)/.test(navigator.language || "") ? "cs" : "en"); } catch (e) {}
  if (!TXT[lang]) lang = "cs";
  var langEl = document.getElementById("lang"), kdoEl = {}, stinLbl = [];
  function setLang(l) {
    lang = l; var t = TXT[l];
    try { localStorage.setItem("lang", l); } catch (e) {}
    document.documentElement.lang = l;
    document.querySelectorAll("[data-t]").forEach(function (e) { e.innerHTML = t[e.getAttribute("data-t")]; });
    langEl.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-l") === l); });
    for (var k in kdoEl) kdoEl[k].textContent = t.kdo[k];
    stinLbl.forEach(function (e) { e.textContent = t.shadow; });
    if (window.__draw) { window.__draw(); window.__drawTmp(); }
  }
  langEl.addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (b) setLang(b.getAttribute("data-l")); });
  setLang(lang);
  var T = Q.tokeny, N = T.length, AV = Q.att_vrstvy, H = Q.hlavy;
  function show(s) { return s === "\n" ? "↵" : s.replace(/ /g, "▁"); }
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

  document.getElementById("poem").innerHTML = Q.verse.map(esc).join("<br>");

  var attBytes = (function () { var s = atob(Q.attention), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; })();
  function att(l, h, i, j) { return attBytes[((l * H + h) * N + i) * N + j] / 255; }

  var rowsOf = [], cur = [];
  T.forEach(function (t, i) { if (t.s === "\n") { rowsOf.push(cur); cur = []; } else cur.push(i); });
  rowsOf.push(cur);

  var sel = N - 1, head = 0;
  var attL = document.getElementById("attL"), attLv = document.getElementById("attLv");
  attL.max = AV.length;

  var attRows = document.getElementById("attRows"), btns = [];
  rowsOf.forEach(function (idx) {
    var row = document.createElement("div"); row.className = "row";
    idx.forEach(function (i) {
      var b = document.createElement("button"); b.type = "button"; b.className = "tok";
      b.textContent = show(T[i].s);
      b.addEventListener("click", function () { sel = i; draw(); });
      btns[i] = b; row.appendChild(b);
    });
    attRows.appendChild(row);
  });

  var heads = document.getElementById("heads"), headEls = [], ctxs = [], labels = [];
  for (var h = 0; h < H; h++) (function (h) {
    var el = document.createElement("button"); el.type = "button"; el.className = "head";
    var c = document.createElement("canvas"); c.width = N; c.height = N;
    var l = document.createElement("div"); l.className = "l";
    el.appendChild(c); el.appendChild(l);
    el.addEventListener("click", function () { head = h; draw(); });
    heads.appendChild(el); headEls.push(el); ctxs.push(c.getContext("2d")); labels.push(l);
  })(h);

  var attCap = document.getElementById("attCap");
  function draw() {
    var l = attL.value - 1; attLv.textContent = AV[l];
    var row = [], max = 0;
    for (var j = 0; j <= sel; j++) { row[j] = att(l, head, sel, j); if (row[j] > max) max = row[j]; }
    btns.forEach(function (b, j) {
      b.style.setProperty("--a", (j <= sel && max > 0) ? (0.08 + 0.92 * row[j] / max).toFixed(3) : 0);
      b.classList.toggle("q", j === sel);
      b.classList.toggle("future", j > sel);
    });
    for (var h = 0; h < H; h++) {
      var img = ctxs[h].createImageData(N, N), best = 0, bestJ = 0;
      for (var i = 0; i < N; i++) for (j = 0; j < N; j++) {
        var v = j <= i ? att(l, h, i, j) : 0, a = Math.min(1, v * 1.7), k = (i * N + j) * 4;
        if (i === sel) { img.data[k] = 40 + 176 * a; img.data[k + 1] = 24 + 85 * a; img.data[k + 2] = 20 + 47 * a; }
        else { img.data[k] = 22 + 220 * a; img.data[k + 1] = 21 + 218 * a; img.data[k + 2] = 19 + 214 * a; }
        img.data[k + 3] = 255;
        if (i === sel && v > best) { best = v; bestJ = j; }
      }
      ctxs[h].putImageData(img, 0, 0);
      headEls[h].classList.toggle("on", h === head);
      labels[h].innerHTML = '<span>' + (h + 1) + '</span><b></b>';
      labels[h].lastChild.textContent = show(T[bestJ].s) + " " + Math.round(best * 100) + "%";
    }
    var top = [];
    for (j = 0; j <= sel; j++) top.push([row[j], j]);
    top.sort(function (a, b) { return b[0] - a[0]; });
    var c = TXT[lang].attCap;
    attCap.innerHTML = c[0] + '<b>' + esc(show(T[sel].s)) + '</b>' + c[1] + AV[l] + c[2] + (head + 1) + c[3] +
      top.slice(0, 4).map(function (p) { return '<b>' + esc(show(T[p[1]].s)) + '</b> <i>' + Math.round(p[0] * 100) + '%</i>'; }).join(', ') + '.';
  }
  attL.addEventListener("input", draw);
  window.__draw = draw;
  draw();

  var D = Q.dalsi_vers, tmp = document.getElementById("tmp"), tmpv = document.getElementById("tmpv");
  var poems = document.getElementById("poems"), shadows = document.getElementById("shadows");
  var JAZ = [["zh", "zh"], ["en", "v"], ["cs", "v"]];
  var pokus = {}, stinEl = {}, capEl = {};
  tmp.max = D.cs.teploty.length - 1;
  JAZ.forEach(function (j) {
    var k = j[0], col = document.createElement("div"); col.className = "sl"; pokus[k] = 0;
    var kdo = document.createElement("p"); kdo.className = "kdo"; kdo.textContent = TXT[lang].kdo[k]; col.appendChild(kdo); kdoEl[k] = kdo;
    D[k].radky.forEach(function (r) {
      var e = document.createElement("p");
      if (r === "") e.className = "gap"; else { e.className = j[1]; e.textContent = r; }
      col.appendChild(e);
    });
    poems.appendChild(col);
    var col2 = document.createElement("div"); col2.className = "sl";
    var l = document.createElement("p"); l.className = "kdo stin-l"; l.textContent = TXT[lang].shadow; col2.appendChild(l); stinLbl.push(l);
    var st = document.createElement("p"); st.className = j[1] + " stin";
    st.addEventListener("click", function () { pokus[k]++; drawTmp(); });
    col2.appendChild(st); stinEl[k] = st;
    var c = document.createElement("p"); c.className = "cap"; col2.appendChild(c); capEl[k] = c;
    shadows.appendChild(col2);
  });
  function drawTmp() {
    var i = tmp.value;
    tmpv.textContent = D.cs.teploty[i].t.toFixed(1);
    JAZ.forEach(function (j) {
      var k = j[0], d = D[k], z = d.teploty[i], vs = z.verse;
      var vv = vs[pokus[k] % vs.length]; if (typeof vv === "string") vv = [vv];
      stinEl[k].innerHTML = vv.length ? vv.map(esc).join("<br>") : "…";
      var top = d.kandidati.map(function (c, n) { return [z.p[n], c.s]; }).sort(function (a, b) { return b[0] - a[0]; }).slice(0, 3);
      capEl[k].innerHTML = TXT[lang].firstTok + top.map(function (c) { return '<b>' + esc(show(c[1])) + '</b> <i>' + Math.round(c[0] * 100) + '%</i>'; }).join(', ') +
        (z.t === 0 ? '' : ' · ' + (pokus[k] % vs.length + 1) + '/' + vs.length);
    });
  }
  tmp.addEventListener("input", function () { JAZ.forEach(function (j) { pokus[j[0]] = 0; }); drawTmp(); });
  window.__drawTmp = drawTmp;
  drawTmp();

  var wraps = [document.getElementById("poemWrap"), document.getElementById("shadowWrap")];
  function okraj() { wraps.forEach(function (w) { w.classList.toggle("dal", w.scrollLeft + w.clientWidth < w.scrollWidth - 4); }); }
  wraps.forEach(function (w, i) {
    w.addEventListener("scroll", function () {
      var o = wraps[1 - i]; if (Math.abs(o.scrollLeft - w.scrollLeft) > 1) o.scrollLeft = w.scrollLeft;
      okraj();
    });
  });
  window.addEventListener("resize", okraj); okraj();
})();
</script>
